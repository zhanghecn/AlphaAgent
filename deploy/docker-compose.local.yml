# =============================================================================
# AlphaAgent Docker Compose - Local Directory Version
# =============================================================================
# This configuration uses local directories for data storage instead of named
# volumes, making server migration a directory copy operation.
#
# 流量入口是 alphaagent-gateway（唯一对外端口，默认 80）。
# api / web 仅在内部网络暴露，所有请求都经网关；默认读取接口无需登录。
#
# Quick Start:
#   1. ./docker-deploy.sh          # 生成 .env（含可选的管理员写操作凭证）
#   2. docker compose -f docker-compose.local.yml up -d
#   3. 打开 http://<server> 直接使用；/login 仅用于管理员写操作
#
# 后续迭代发版（一条命令，自动拉最新镜像）:
#   docker compose -f docker-compose.local.yml up -d
# =============================================================================

services:
  alphaagent-gateway:
    image: ${ALPHAAGENT_GATEWAY_IMAGE:-ghcr.io/zhanghecn/alphaagent-gateway:latest}
    container_name: alphaagent-gateway
    restart: unless-stopped
    pull_policy: always
    ulimits:
      nofile:
        soft: 100000
        hard: 100000
    environment:
      AUTH_REQUIRED: ${AUTH_REQUIRED:-false}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET:-}
      JWT_TOKEN_TTL: ${JWT_TOKEN_TTL:-24h}
      GATEWAY_PORT: "80"
      API_UPSTREAM: http://alphaagent-api:8000
      WEB_UPSTREAM: http://alphaagent-web:80
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${GATEWAY_PORT:-80}:80"
    depends_on:
      alphaagent-api:
        condition: service_healthy
      alphaagent-web:
        condition: service_started
    networks:
      - alphaagent-network
    healthcheck:
      test: ["CMD", "/usr/local/bin/gateway", "-healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  alphaagent-api:
    image: ${ALPHAAGENT_IMAGE:-ghcr.io/zhanghecn/alphaagent-api:latest}
    container_name: alphaagent-api
    cpus: ${ALPHAAGENT_API_CPUS:-1.0}
    restart: unless-stopped
    pull_policy: always
    ulimits:
      nofile:
        soft: 100000
        hard: 100000
    command:
      - python
      - -m
      - uvicorn
      - alphaagent.server.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --workers
      - "${ALPHAAGENT_API_WORKERS:-2}"
    environment:
      ALPHAAGENT_ENV: ${ALPHAAGENT_ENV:-production}
      ALPHAAGENT_API_HOST: 0.0.0.0
      ALPHAAGENT_API_PORT: 8000
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
      MARKET_TIMEOUT_SECONDS: ${MARKET_TIMEOUT_SECONDS:-8}
      MARKET_PAGE_SIZE: ${MARKET_PAGE_SIZE:-50}
      ALPHAAGENT_STARTUP_DATA_SYNC_SCHEDULER: "false"
      ALPHAAGENT_STARTUP_MARKET_CACHE_WARMUP: ${ALPHAAGENT_STARTUP_MARKET_CACHE_WARMUP:-false}
      ALPHAAGENT_STARTUP_INTRADAY_REFRESHER: ${ALPHAAGENT_STARTUP_INTRADAY_REFRESHER:-false}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-alphaagent}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-alphaagent}
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-8}
      DATABASE_MAX_OVERFLOW: ${DATABASE_MAX_OVERFLOW:-8}
      DATABASE_POOL_TIMEOUT_SECONDS: ${DATABASE_POOL_TIMEOUT_SECONDS:-60}
      PGOPTIONS: >-
        -c application_name=alphaagent-api
        -c max_parallel_workers_per_gather=0
      REDIS_URL: redis://redis:6379/0
      TUSHARE_TOKEN: ${TUSHARE_TOKEN:-}
      TUSHARE_API_URL: ${TUSHARE_API_URL:-https://api.tushare.pro}
      TUSHARE_TIMEOUT_SECONDS: ${TUSHARE_TIMEOUT_SECONDS:-12}
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      TZ: ${TZ:-Asia/Shanghai}
    expose:
      - "8000"
    volumes:
      - ./data:/app/data
      - ./vntrader:/app/.vntrader
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - alphaagent-network
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--max-time", "5", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  alphaagent-data-sync-worker:
    extends:
      service: alphaagent-api
    container_name: alphaagent-data-sync-worker
    cpus: ${ALPHAAGENT_SCHEDULER_CPUS:-0.5}
    command:
      - python
      - -m
      - alphaagent.server.services.data_sync_worker
    environment:
      DATABASE_POOL_SIZE: "4"
      DATABASE_MAX_OVERFLOW: "0"
      PGOPTIONS: >-
        -c application_name=alphaagent-scheduler
        -c max_parallel_workers_per_gather=0
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    expose: []
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--max-time", "5", "http://127.0.0.1:8010/healthz"]
      interval: 30s
      timeout: 10s
      retries: 2
      start_period: 60s

  alphaagent-web:
    image: ${ALPHAAGENT_WEB_IMAGE:-ghcr.io/zhanghecn/alphaagent-web:latest}
    container_name: alphaagent-web
    restart: unless-stopped
    pull_policy: always
    ulimits:
      nofile:
        soft: 100000
        hard: 100000
    environment:
      # 同源经网关访问，前端用相对 /api。
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
      AUTH_REQUIRED: ${AUTH_REQUIRED:-false}
      TZ: ${TZ:-Asia/Shanghai}
    expose:
      - "80"
    depends_on:
      alphaagent-api:
        condition: service_healthy
    networks:
      - alphaagent-network

  postgres:
    image: postgres:16-alpine
    container_name: alphaagent-postgres
    cpus: ${ALPHAAGENT_POSTGRES_CPUS:-1.0}
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 100000
        hard: 100000
    environment:
      PGDATA: /var/lib/postgresql/data
      POSTGRES_USER: ${POSTGRES_USER:-alphaagent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-alphaagent}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    networks:
      - alphaagent-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-alphaagent} -d ${POSTGRES_DB:-alphaagent}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:8-alpine
    container_name: alphaagent-redis
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 100000
        hard: 100000
    command: redis-server --save 60 1 --appendonly yes --appendfsync everysec
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ./redis_data:/data
    networks:
      - alphaagent-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

networks:
  alphaagent-network:
    driver: bridge
