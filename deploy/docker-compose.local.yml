# =============================================================================
# AlphaAgent Docker Compose - Local Directory Version
# =============================================================================
# This configuration uses local directories for data storage instead of named
# volumes, making server migration a directory copy operation.
#
# Quick Start:
#   1. Copy .env.example to .env and configure secrets
#   2. mkdir -p data postgres_data redis_data
#   3. docker compose -f docker-compose.local.yml up -d
#   4. Open http://localhost:5173
# =============================================================================

services:
  alphaagent-api:
    image: ${ALPHAAGENT_IMAGE:-ghcr.io/zhanghecn/alphaagent-api:latest}
    container_name: alphaagent-api
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 100000
        hard: 100000
    command:
      - python
      - -m
      - uvicorn
      - alphaagent.server.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    environment:
      ALPHAAGENT_ENV: ${ALPHAAGENT_ENV:-production}
      ALPHAAGENT_API_HOST: 0.0.0.0
      ALPHAAGENT_API_PORT: 8000
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:8000}
      MARKET_TIMEOUT_SECONDS: ${MARKET_TIMEOUT_SECONDS:-8}
      MARKET_PAGE_SIZE: ${MARKET_PAGE_SIZE:-50}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-alphaagent}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-alphaagent}
      REDIS_URL: redis://redis:6379/0
      TUSHARE_TOKEN: ${TUSHARE_TOKEN:-}
      TUSHARE_API_URL: ${TUSHARE_API_URL:-https://api.tushare.pro}
      TUSHARE_TIMEOUT_SECONDS: ${TUSHARE_TIMEOUT_SECONDS:-12}
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${ALPHAAGENT_API_PORT:-8000}:8000"
    volumes:
      - ./data:/app/data
      - ./vntrader:/app/.vntrader
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - alphaagent-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  alphaagent-web:
    image: ${ALPHAAGENT_WEB_IMAGE:-ghcr.io/zhanghecn/alphaagent-web:latest}
    container_name: alphaagent-web
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 100000
        hard: 100000
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api}
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${ALPHAAGENT_WEB_PORT:-5173}:80"
    depends_on:
      alphaagent-api:
        condition: service_healthy
    networks:
      - alphaagent-network

  postgres:
    image: postgres:16-alpine
    container_name: alphaagent-postgres
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 100000
        hard: 100000
    environment:
      PGDATA: /var/lib/postgresql/data
      POSTGRES_USER: ${POSTGRES_USER:-alphaagent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-alphaagent}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    networks:
      - alphaagent-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-alphaagent} -d ${POSTGRES_DB:-alphaagent}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:8-alpine
    container_name: alphaagent-redis
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 100000
        hard: 100000
    command: redis-server --save 60 1 --appendonly yes --appendfsync everysec
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ./redis_data:/data
    networks:
      - alphaagent-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

networks:
  alphaagent-network:
    driver: bridge
