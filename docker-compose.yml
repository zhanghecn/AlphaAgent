services:
  alphaagent-api:
    build:
      context: .
      dockerfile: Dockerfile.alphaagent-api
    environment:
      ALPHAAGENT_ENV: ${ALPHAAGENT_ENV:-local}
      ALPHAAGENT_API_HOST: ${ALPHAAGENT_API_HOST:-0.0.0.0}
      ALPHAAGENT_API_PORT: ${ALPHAAGENT_API_PORT:-8000}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:8000}
      MARKET_TIMEOUT_SECONDS: ${MARKET_TIMEOUT_SECONDS:-8}
      MARKET_PAGE_SIZE: ${MARKET_PAGE_SIZE:-50}
      DATABASE_URL: ${DATABASE_URL:-}
      REDIS_URL: ${REDIS_URL:-redis://host.docker.internal:6379/0}
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  alphaagent-web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
    ports:
      - "5173:5173"
    depends_on:
      - alphaagent-api
